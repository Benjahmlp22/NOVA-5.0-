# Los tests, en cada empujón y en cada pull request.
#
# Corre en Windows y no en Linux porque NOVA es de Windows de arriba
# abajo: SAPI y las voces OneCore, el OCR de WinRT, pywin32 para las
# ventanas y el mezclador de audio. En ubuntu-latest la mitad de la
# suite ni siquiera importaría.
#
# Los modelos (Vosk, Whisper, CLIP) NO se descargan: son gigas y los
# tests que los necesitan se saltan solos con pytest.skip. Lo que se
# comprueba aquí es la lógica, que es lo que se rompe al editar.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        # Sin las ruedas de CUDA: pesan más de 2 GB y aquí no hay GPU
        # que las use. NOVA cae a CPU sola cuando no están.
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 vosk sounddevice numpy pyttsx3 httpx psutil mss python-dotenv ddgs pycaw comtypes pywin32 onnxruntime pillow pytest ruff

      - name: Estilo
        run: ruff check .

      - name: Tests
        # Sin micrófono, sin GPU y sin red: si algo aquí necesita
        # cualquiera de las tres, es que el test está mal escrito.
        run: pytest tests -q
